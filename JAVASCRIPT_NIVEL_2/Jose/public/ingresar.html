       
    <div id="appHeader"></div>
    
       <div class="container">
        
        <hr>
        <h1>Ingrese datos de contacto</h1>
        <hr>

        <form id="form-contacto">
            

            <div class="row">

                <div class="col-sm-4">
                    
                    <div class="mb-3 mt-3">
                        <label for="cedula" class="form-label">Cedula ID:</label>
                        <input type="text" class="form-control" id="cedula" placeholder="Ingrese numero de cedula" name="cedula"  maxlength="10" required>
                    </div>

                    <div class="mb-3 mt-3">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email" placeholder="Ingrese el email" name="email" required>
                    </div>

                </div>

                <div class="col-sm-4">
                    
                    <div class="mb-3 mt-3">
                        <label for="nombre" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Ingrese el nombre" name="nombre" maxlength="80" required>
                    </div>

                    <div class="mb-3 mt-3">
                        <label for="telefono" class="form-label">Telefono:</label>
                        <input type="text" class="form-control" id="telefono" placeholder="Ingrese numero de telefono" name="telefono" required>
                    </div>

                </div>

                <div class="col-sm-4">

                    <div class="mb-3 mt-3">
                        <label for="apellido" class="form-label">Apellido:</label>
                        <input type="text" class="form-control" id="apellido" placeholder="Ingrese el apellido" name="apellido" required>
                    </div>

                    <div class="mb-3 mt-3">
                        <label for="direccion" class="form-label">Direccion:</label>
                        <textarea name="direccion" id="direccion" class="form-control" placeholder="Ingrese la direccion" style="resize: none;" required></textarea>
                    </div>

                </div>

            </div>
