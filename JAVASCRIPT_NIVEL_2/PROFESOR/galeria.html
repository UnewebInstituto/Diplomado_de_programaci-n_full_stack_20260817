<html lang="en">
<head>

    <title>Galería de Imágenes</title>
    <link rel="stylesheet" href="galeria.css">
</head>
<body>

    <div id="principal">
        <img id="imagen_principal" alt="Imagen principal" src="../img/1.jpg">

    <div id="miniaturas">
        <img class="miniatura" src="../img/1.jpg" alt="Imagen 1" onclick="a(this)">
        <img class="miniatura" src="../img/2.jpg" alt="Imagen 2" onclick="a(this)">
        <img class="miniatura" src="../img/3.jpg" alt="Imagen 3" onclick="a(this)">

    </div>
