<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo03 Multimedia</title>
    <style>
        #ej_video{width: 600px;
            height: 300px;}
        video{width: 100%;
            height: 100%;}
    </style>
</head>
<body>
    <h1>Ejemplo03 Etiquetas Mutimedia</h1>
    <ul>
        <a href="./index.html"><li>Selector de archivos</li></a>
    </ul><br>
    <h2>Audio</h2>
    <a href="https://developer.mozilla.org/es/docs/Web/API/Web_Audio_API">Documentación Audio</a>

    <!-- 
    https://es.wikipedia.org/wiki/Ogg
    https://es.wikipedia.org/wiki/MP3
    https://es.wikipedia.org/wiki/Waveform_Audio_Format
    -->

    <!-- 1ra. Forma 
    <audio src="./audio/idoberg-relaxing-guitar-loop-v5-245859.mp3" controls></audio>    
    -->
    <!-- 1ra. Forma -->
    <audio controls>
        <source src="./audio/idoberg-relaxing-guitar-loop-v5-245859.mp3" type="audio/mp3">
        <source src="./audio/idoberg-relaxing-guitar-loop-v5-245859.mp3" type="audio/ogg">
        <source src="./audio/idoberg-relaxing-guitar-loop-v5-245859.mp3" type="audio/wav">
    </audio>

    <hr>
    <h2>Video</h2>
    <a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/source">Documentación vídeo</a>
    <hr>
    <h2>Track</h2>
    <a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/track">Documentación track</a>
    <h2>Archivos VTT</h2>
    <a href="https://developer.mozilla.org/en-US/docs/Web/API/WebVTT_API">Documentación archivos VTT</a><br><br>
    <hr>
    <div id="ej_video">
    <div id="ej_video">
        <video controls>
            <source src="./video/370344_medium.mp4" type="video/mp4">
            <source src="./video/370344_medium.webm" type="video/webm">
            <source src="./video/370344_medium.ogg" type="video/ogg">
            <track kind="captions" 
                   srclang="es" 
                   label="Español" 
                   src="./track/contenido_es.vtt"></track>
        </video>
    </div>
</body>
</html>
