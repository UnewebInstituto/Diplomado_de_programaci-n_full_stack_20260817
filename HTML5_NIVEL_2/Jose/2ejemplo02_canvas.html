<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2Ejemplo02_canvas</title>
</head>
<body>
    <h1>2Ejemplo02_canvas</h1>
    <ul>
        <li><a href="https://developer.mozilla.org/en-US/docs/Web/API/Canvas_API">Documentation</a></li>
        <li><a href="./2ejemplo02_responsive.html">REGRESAR</a></li>
    </ul>
    <hr>
    <canvas id="lienzo" width="600px" height="600px"></canvas>
    <script>
        const canvas = document.getElementById("lienzo");
        const ctx = canvas.getContext("2d");
        
        // Declaración Array de colores
        let color = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF'];

        // Declaración Variables punto de origen
        let x, y;

        // Inicialización de variables
        x = 0;
        y = 0;

        // Cycle para 6 cuadros
        for (let index = 0; index < color.length; index++) {
            ctx.fillStyle = color[index];
            ctx.fillRect(x, y, 100, 100);
            x = x + 100;
            y = y + 100;
        }
        //ctx.fillStyle = "green";
        //ctx.fillRect(0, 0, 100, 100);
    </script>
    
</body>
</html>
