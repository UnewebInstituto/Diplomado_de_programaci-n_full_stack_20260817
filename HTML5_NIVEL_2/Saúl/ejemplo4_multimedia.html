<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 3 Multimedia</title>
<style>
    #ej_video{
        width: 400px;
        height: 300px;
    }
    video{
        width: 100%;
        height: 100%;
    }
    #ej2_video{
        width: 400px;
        height: 300px;
    }
</style>
</head>
<body>
    <h1>Ejemplo 3 etiqueta multimedia </h1>
    <!--1ra forma, es la siguiente:-->
    <div id="ej_video">
    <video src="./video/154610-807726772_medium.mp4" controls></video>
    </div>
    <br>
    <!--2da forma, es la siguiente:-->
    <div id="ej2_video">
        <video controls>
            <source src="./video/154610-807726772_medium.mp4" type="video/mpeg">
            <source src="./video/154610-807726772_medium.mp4" type="video/webm">
            <source src="./video/154610-807726772_medium.mp4" type="video/ogg">
            <track kind="captions" 
                srclang="es" 
                label="español" 
                src="./track/contenido_es.vtt"></track>
        </video>
    </div>
</body>
</html>
