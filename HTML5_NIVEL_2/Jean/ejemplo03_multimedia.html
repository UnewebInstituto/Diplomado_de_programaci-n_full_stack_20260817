<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo03 Multimedia</title>
    <style>
        #ej_video{
            width: 600px;
            height: 300px;
        }
        video{
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <h1>Ejemplo03 Etiqueta Multimedia</h1>
    <li><a href="./index.html">Regresar</a></li>
    <h2>Video</h2>



    <a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/source">Documentación vídeo</a>
    <hr>
    <h2>Audio</h2>
    <a href="">Documentación audio</a>
    <!-- 
    https://es.wikipedia.org/wiki/Ogg
    https://es.wikipedia.org/wiki/MP3
    https://es.wikipedia.org/wiki/Waveform_Audio_Format
    -->

    <!--primera forma-->
    <audio src="./audio/arunangshubanerjee-live-football-match-stadium-crowd-cheering-563439.mp3" type="audio/mp3"></audio>
   <source src="./audio/arunangshubanerjee-live-football-match-stadium-crowd-cheering-563439.mp3" type="audio/ogg">

   <source src="./audio/arunangshubanerjee-live-football-match-stadium-crowd-cheering-563439.mp3" type="audio/webm">
    <h2>Track</h2>
   
    <a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/track">Documentación track</a>
   
    <h2>Archivos VTT</h2>
   
    <a href="https://developer.mozilla.org/en-US/docs/Web/API/WebVTT_API">Documentación archivos VTT</a>
   
    <div id="ej_video">
        <!-- 1ra. Forma 
        <video src="./video/370344_medium.mp4" controls></video>
    
        -->

        <!--segunda forma-->
        
        </video>
        <video controls>
            <source src="./video/370344_medium.mp4" type="video/mp4">
            <source src="./video/370344_medium.webm" type="video/webm">
            <source src="./video/370344_medium.ogg" type="video/ogg">
            <track kind="captions" 
                   srclang="es" 
                   label="Español" 
                   src="./track/contenido_es.vtt"></track>
        </video>
    </div>

</body>
</html>
