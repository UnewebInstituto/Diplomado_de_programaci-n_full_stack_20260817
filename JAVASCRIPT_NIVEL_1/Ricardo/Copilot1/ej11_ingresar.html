<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <h2>Ingresar</h2>
        <form action="" method="post">
            <div class="row">
                <!-- 1ra. Columan de entradas -->
                <div class="col-md-6">
                    <div class="mb-3 mt-3">
                        <label for="cedula" class="form-label">Cédula de identidad:</label>
                        <input type="text" class="form-control" id="cedula" maxlength="10" placeholder="Ingrese cédula" name="cedula" required>
                    </div>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="nombre" maxlength="80" placeholder="Ingrese nombre" name="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="apellido" class="form-label">Apellido:</label>
                        <input type="text" class="form-control" id="apellido" maxlength="80" placeholder="Ingrese apellido" name="apellido" required>
                    </div>
                </div>
                <!-- 2da. Columna de entradas -->
                <div class="col-md-6">
                    <div class="mb-3 mt-3">
                        <label for="telefono" class="form-label">Teléfono:</label>
                        <input type="text" class="form-control" id="telefono" maxlength="15" placeholder="Ingrese teléfono" name="telefono" required>
                    </div>
                    <div class="mb-3">
                        <label for="correo_electronico" class="form-label">Correo electrónico:</label>
                        <input type="email" class="form-control" id="correo_electronico" placeholder="Ingrese correo electrónico" name="correo_electronico" required>
                    </div>
                    <div class="mb-3">
                        <label for="direccion" class="form-label">Dirección:</label>
                        <textarea name="direccion" id="direccion" class="form-control" placeholder="Ingrese dirección" style="resize: none;"></textarea>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
            <button type="reset" class="btn btn-secondary">Limpiar</button>
        </form>
    </div>
</body>
</html>
