    <!-- Caso 2: A través de la etiqueta script -->
    <script>
        console.log('El navegador detecto la etiqueta script, que se encuentra al final del DOM (Modelo de Objetos del Documento)');
    </script>
    <script src="./script/ej01_declaraciones.js"></script>
</body>
</html>
