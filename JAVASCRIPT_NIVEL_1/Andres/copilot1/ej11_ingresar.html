<h2>Ingresar contacto</h2>
<form id="formulario-contacto">
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3 mt-3">
                <label for="cedula" class="form-label">Cédula de identidad:</label>
                <input type="text" class="form-control" id="cedula" name="cedula" maxlength="10" required>
            </div>
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="nombre" name="nombre" maxlength="80" required>
            </div>
            <div class="mb-3">
                <label for="apellido" class="form-label">Apellido:</label>
                <input type="text" class="form-control" id="apellido" name="apellido" maxlength="80" required>
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3 mt-3">
                <label for="telefono" class="form-label">Teléfono:</label>
                <input type="tel" class="form-control" id="telefono" name="telefono" maxlength="15">
            </div>
            <div class="mb-3">
                <label for="correo_electronico" class="form-label">Correo electrónico:</label>
                <input type="email" class="form-control" id="correo_electronico" name="correo_electronico" required>
            </div>
            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección:</label>
                <textarea name="direccion" id="direccion" class="form-control" rows="3" style="resize: none;"></textarea>
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Guardar contacto</button>
    <button type="reset" class="btn btn-secondary">Limpiar</button>
</form>
