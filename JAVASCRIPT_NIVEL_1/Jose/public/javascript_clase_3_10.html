<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>javascript_Clase_3_10</title>
   <link rel="stylesheet" href="./style/clase_3_10.css">
</head>
<body>
   <h1>Ejemplo Clase_3 10 Usuario Registro</h1>
    <form id="formUsuario" action="/usuarios" method="POST">
        <table>
            <tr>
                <td>Nombre:</td>
                <td><input type="text" name="nombre" id="nombre" required onblur="validarNombre()"></td>
                <td id="mensajeNombre"></td>
            </tr>
            <tr>
                <td>Apellido:</td>
                <td>
                    <input type="text" name="apellido" id="apellido" required onblur="validarApellido()">
                </td>
                <td id="mensajeApellido"></td>
            </tr>
            <tr>
                <td>Correo electrónico:</td>
                <td>
                    <input type="email" name="email" id="email" required onblur="validarEmail()">
                </td>
                <td id="mensajeEmail"></td>
            </tr>
            <tr>
                <td>Clave: 
                    <div class="password-container">
                        <span class="toggle-password" id="toggleIcon">(show)🔒</span>
                    </div></td> 
                <td>
                    <input type="password" name="password1" id="password1" required onblur="validarPassword1()">
                </td> 
                <td id="mensajePassword1"></td>
            </tr>
            <tr>
                <td>Repetir Clave: <img src="./img/eyeclose.png" alt="" name="revealClave2" id="revealClave2" onclick="revelarClave2(this)"></td>
                <td>
                    <input type="password" name="password2" id="password2" required onblur="validarPassword2()">
                </td>
                <td id="mensajePassword2"></td>
            </tr>
            <tr>
                <td coldspan="3">
                  <button type="submit" class="botones1" id="btnRegistrar" name="btnRegistrar" disabled>Registrar</button>
                  <button type="reset" class="botones1" id="btnLimpiar" name="btnLimpiar">Limpiar</button>
                </td>
            </tr>
        </table>
    </form>
    <p id="mensajeResultado" role="status" aria-live="polite"></p>
    <script src="./script/javascript_clase_3_10.js"></script>
</body>
</html>
