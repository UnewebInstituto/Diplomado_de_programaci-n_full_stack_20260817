<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>javascript_Clase_3_10</title>
   <link rel="stylesheet" href="./style/clase_3_10.css">
</head>
<body>
   <h1>Ejemplo Clase_3 10 Usuario Registro</h1>
    <form action="">
        <table>
            <tr>
                <td>Nombre:</td>
                <td><input type="text" name="nombre" id="nombre" required></td>
                <td id="mensajeNombre"></td>
            </tr>
            <tr>
                <td>Apellido:</td>
                <td>
                    <input type="text" name="apellido" id="apellido" required>
                </td>
                <td id="mensajeApellido"></td>
            </tr>
            <tr>
                <td>Correo electrónico:</td>
                <td>
                    <input type="email" name="email" id="email" required>
                </td>
                <td id="mensajeEmail"></td>
            </tr>
            <tr>
                <td>Clave:</td>
                <td>
                    <input type="password1" name="password1" id="password1" required>
                </td>
                <td id="mensajePassword1"></td>
            </tr>
            <tr>
                <td>Repetir Clave:</td>
                <td>
                    <input type="password2" name="password2" id="password2" required>
                </td>
                <td id="mensajePassword2"></td>
            </tr>
            <tr>
                <td coldspan="3">
                  <button class="botones1" id="btnRegistrar" name="btnRegistrar" disabled>Registrar</button>
                  <button class="botones1" id="btnLimpiar" name="btnLimpiar">Limpiar</button>
                </td>
            </tr>
        </table>
    </form>
    <script src="./scripts/javascript_clase_3_10.js"></script>
</body>
</html>
