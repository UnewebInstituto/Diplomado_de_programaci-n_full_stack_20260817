<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Chat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Chat con Gemini</h1>

      <form id="chat-form">
        <label for="prompt">Escribe tu pregunta</label>
        <textarea
          id="prompt"
          rows="5"
          placeholder="Ejemplo: Explica qué es la inteligencia artificial en tres líneas"
        ></textarea>

        <button type="submit" id="send-btn">Enviar</button>
      </form>

      <section class="response-box">
        <h2>Respuesta</h2>
        <div id="response" class="response">Tu respuesta aparecerá aquí.</div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
