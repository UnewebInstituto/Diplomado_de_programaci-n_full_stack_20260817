<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Web App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Gemini Web App</h1>

      <div class="panel">
        <label for="prompt">Escribe tu pregunta</label>
        <textarea id="prompt" rows="5" placeholder="Ejemplo: Explica qué es la inteligencia artificial en 3 líneas."></textarea>
        <button id="sendBtn">Consultar Gemini</button>
      </div>

      <div class="response-box">
        <h2>Respuesta</h2>
        <div id="result">Aún no hay respuesta.</div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
